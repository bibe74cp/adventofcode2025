services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sql2025
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_MEMORY_LIMIT_MB: 2048
    volumes:
      - sql_data:/var/opt/mssql
      - aoc_data:/var/aoc
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    healthcheck:
      test: >-
        /opt/mssql-tools18/bin/sqlcmd
        -S 127.0.0.1
        -U sa
        -P "$MSSQL_SA_PASSWORD"
        -No
        -Q "SELECT 1"
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - aoc-network

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - ./initdb:/scripts:ro
    entrypoint: /bin/bash
    command: /scripts/init.sh
    networks:
      - aoc-network

volumes:
  sql_data:
    driver: local
  aoc_data:
    driver: local

networks:
  aoc-network:
    driver: bridge
